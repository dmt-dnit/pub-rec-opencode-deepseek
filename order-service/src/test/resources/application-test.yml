spring:
  datasource:
    url: jdbc:h2:mem:orderdb-test
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "be.dnit.sharedmodel"
        spring.json.value.default.type: be.dnit.sharedmodel.InventoryReservationEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topic: test-integration-topic
    listen-topic: test-integration-topic
