name: Deploy inventory-ui (Vercel Hook)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_DEPLOY_HOOK_URL_INVENTORY_UI: ${{ secrets.VERCEL_DEPLOY_HOOK_URL_INVENTORY_UI }}
    steps:
      - name: Validate deploy hook secret
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL_INVENTORY_UI:-}" ]; then
            echo "Missing required secret: VERCEL_DEPLOY_HOOK_URL_INVENTORY_UI in environment 'Production'." >&2
            exit 1
          fi
      - name: Trigger Vercel deploy hook (inventory-ui)
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL_INVENTORY_UI"
