# CI workflow for pub-rec-opencode-deepseek
#
# Build order:
#   shared-model (install) → auth-server / order-service / inventory-service (verify, parallel)
#   order-ui / inventory-ui (parallel, independent of Maven jobs)
#
# shared-model sharing: each downstream Maven job builds shared-model inline into the default
#   ~/.m2 (`./mvnw -DskipTests install`) before building its own module. This mirrors the
#   documented local build flow and avoids any cross-job file transfer. An earlier attempt used
#   upload/download-artifact, but upload-artifact@v4 reported "No files were found" for the
#   workspace-relative .m2 path, so downstream jobs could not resolve com.example:shared-model.
#   Inline build removes that failure class entirely; shared-model is tiny so the rebuild is cheap.
#   setup-java `cache: maven` (keyed on ~/.m2) now applies to all Maven jobs.
#
# Failure isolation: three separate Maven jobs (auth-server, order-service, inventory-service)
#   each have their own `needs: shared-model`. A test failure in one module fails only that job;
#   the other two jobs continue and report independently. `needs: shared-model` is kept as a
#   fail-fast gate (shared-model's own tests must pass before downstream jobs run).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── 1. Shared library (runs its own tests; gates downstream) ──────────────────
  shared-model:
    name: shared-model (install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and install shared-model
        run: cd shared-model && ./mvnw --batch-mode clean install

  # ── 2a. auth-server ──────────────────────────────────────────────────────────
  auth-server:
    name: auth-server (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test auth-server
        run: cd auth-server && ./mvnw --batch-mode clean verify

  # ── 2b. order-service ────────────────────────────────────────────────────────
  order-service:
    name: order-service (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test order-service
        run: cd order-service && ./mvnw --batch-mode clean verify

  # ── 2c. inventory-service ────────────────────────────────────────────────────
  inventory-service:
    name: inventory-service (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test inventory-service
        run: cd inventory-service && ./mvnw --batch-mode clean verify

  # ── 3a. order-ui ─────────────────────────────────────────────────────────────
  order-ui:
    name: order-ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: order-ui/package-lock.json

      - name: Install and build order-ui
        run: cd order-ui && npm ci && npm run build

  # ── 3b. inventory-ui ─────────────────────────────────────────────────────────
  inventory-ui:
    name: inventory-ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-ui/package-lock.json

      - name: Install and build inventory-ui
        run: cd inventory-ui && npm ci && npm run build
