# CI workflow for pub-rec-opencode-deepseek
#
# Build order:
#   shared-model (install) → auth-server / order-service / inventory-service (verify, parallel)
#   order-ui / inventory-ui (parallel, independent of Maven jobs)
#
# shared-model sharing: each downstream Maven job builds shared-model inline into the default
#   ~/.m2 (`./mvnw -DskipTests install`) before building its own module. This mirrors the
#   documented local build flow and avoids any cross-job file transfer. An earlier attempt used
#   upload/download-artifact, but upload-artifact@v4 reported "No files were found" for the
#   workspace-relative .m2 path, so downstream jobs could not resolve com.example:shared-model.
#   Inline build removes that failure class entirely; shared-model is tiny so the rebuild is cheap.
#   setup-java `cache: maven` (keyed on ~/.m2) now applies to all Maven jobs.
#
# Failure isolation: three separate Maven jobs (auth-server, order-service, inventory-service)
#   each have their own `needs: shared-model`. A test failure in one module fails only that job;
#   the other two jobs continue and report independently. `needs: shared-model` is kept as a
#   fail-fast gate (shared-model's own tests must pass before downstream jobs run).
#
# Security scanning: a dedicated `owasp-dependency-check` job runs the OWASP Dependency-Check
#   Maven plugin across all four Maven modules (invoked via plugin goal on the command line —
#   no pom.xml changes required). Threshold: fail on CVSS >= 7 (High/Critical).
#   The job is `continue-on-error: true` in this first iteration (report-only) because:
#     (a) The NVD database download is slow/rate-limited without an API key.
#     (b) The NVD API key must be added by a repo admin before the scan is reliable.
#   Once the NVD_API_KEY secret is in place and the DB cache is stable, remove
#   `continue-on-error` to promote this job to a blocking gate.
#
# ADMIN ACTION REQUIRED (Dimitri):
#   1. NVD API key — add NVD_API_KEY as a repository secret
#      (Settings → Secrets and variables → Actions → New repository secret).
#      Without it the plugin falls back to public NVD feeds (rate-limited, slow, may
#      time out on first run). Free key: https://nvd.nist.gov/developers/request-an-api-key
#   2. Dependabot alerts — enable in repository settings
#      (Settings → Security → Code security → Dependabot alerts → Enable).
#      .github/dependabot.yml is now committed but alerts require the repo-level toggle.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── 1. Shared library (runs its own tests; gates downstream) ──────────────────
  shared-model:
    name: shared-model (install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and install shared-model
        run: cd shared-model && ./mvnw --batch-mode clean install

  # ── 2a. auth-server ──────────────────────────────────────────────────────────
  auth-server:
    name: auth-server (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test auth-server
        run: cd auth-server && ./mvnw --batch-mode clean verify

  # ── 2b. order-service ────────────────────────────────────────────────────────
  order-service:
    name: order-service (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test order-service
        run: cd order-service && ./mvnw --batch-mode clean verify

  # ── 2c. inventory-service ────────────────────────────────────────────────────
  inventory-service:
    name: inventory-service (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test inventory-service
        run: cd inventory-service && ./mvnw --batch-mode clean verify

  # ── 3a. order-ui ─────────────────────────────────────────────────────────────
  order-ui:
    name: order-ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: order-ui/package-lock.json

      - name: Install and build order-ui
        run: cd order-ui && npm ci && npm run build

  # ── 3b. inventory-ui ─────────────────────────────────────────────────────────
  inventory-ui:
    name: inventory-ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-ui/package-lock.json

      - name: Install and build inventory-ui
        run: cd inventory-ui && npm ci && npm run build

  # ── 4. OWASP Dependency-Check (server-side CVE scan) ─────────────────────────
  #
  # Policy: fail on CVSS >= 7 (High/Critical). Report-only in this first iteration
  # (`continue-on-error: true`). Promote to blocking once NVD_API_KEY is set and
  # the NVD DB cache is stable (remove continue-on-error).
  #
  # Each Maven module is scanned independently via the plugin goal invoked on the
  # command line — no pom.xml changes. shared-model is installed inline so
  # downstream modules can resolve it during the scan's dependency resolution.
  #
  # NVD DB is cached under ~/.owasp/dependency-check-data keyed on runner OS +
  # all pom.xml hashes. The cache restores stale data if the exact key misses,
  # which limits full re-downloads to pom changes or weekly cache expiry.
  owasp-dependency-check:
    name: OWASP Dependency-Check (CVSS >= 7 threshold, report-only)
    runs-on: ubuntu-latest
    # NOT listed in `needs` of any other job — scan hiccups cannot mask test failures.
    # continue-on-error: true until NVD_API_KEY is added and the cache is stable.
    # To promote to blocking: remove the line below and re-push.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Install shared-model (needed for downstream module dependency resolution)
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Scan shared-model
        run: |
          cd shared-model && ./mvnw --batch-mode \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DdataDirectory=$HOME/.owasp/dependency-check-data \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -Dformat=HTML \
            -DprettyPrint=true

      - name: Scan auth-server
        run: |
          cd auth-server && ./mvnw --batch-mode \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DdataDirectory=$HOME/.owasp/dependency-check-data \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -Dformat=HTML \
            -DprettyPrint=true

      - name: Scan order-service
        run: |
          cd order-service && ./mvnw --batch-mode \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DdataDirectory=$HOME/.owasp/dependency-check-data \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -Dformat=HTML \
            -DprettyPrint=true

      - name: Scan inventory-service
        run: |
          cd inventory-service && ./mvnw --batch-mode \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DdataDirectory=$HOME/.owasp/dependency-check-data \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -Dformat=HTML \
            -DprettyPrint=true

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-reports
          path: |
            shared-model/target/dependency-check-report.html
            auth-server/target/dependency-check-report.html
            order-service/target/dependency-check-report.html
            inventory-service/target/dependency-check-report.html
          if-no-files-found: warn
