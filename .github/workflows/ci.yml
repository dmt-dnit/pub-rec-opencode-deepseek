# CI workflow for pub-rec-opencode-deepseek
#
# Build order:
#   shared-model (install) → auth-server / order-service / inventory-service (verify, parallel)
#   order-ui / inventory-ui (parallel, independent of Maven jobs)
#
# shared-model sharing: each downstream Maven job builds shared-model inline into the default
#   ~/.m2 (`./mvnw -DskipTests install`) before building its own module. This mirrors the
#   documented local build flow and avoids any cross-job file transfer. An earlier attempt used
#   upload/download-artifact, but upload-artifact@v4 reported "No files were found" for the
#   workspace-relative .m2 path, so downstream jobs could not resolve be.dnit:shared-model.
#   Inline build removes that failure class entirely; shared-model is tiny so the rebuild is cheap.
#   setup-java `cache: maven` (keyed on ~/.m2) now applies to all Maven jobs.
#
# Failure isolation: three separate Maven jobs (auth-server, order-service, inventory-service)
#   each have their own `needs: shared-model`. A test failure in one module fails only that job;
#   the other two jobs continue and report independently. `needs: shared-model` is kept as a
#   fail-fast gate (shared-model's own tests must pass before downstream jobs run).
#
# Security scanning: a dedicated `snyk-security` job runs `snyk test --all-projects`
#   across all 4 Maven modules + both npm UIs (no pom.xml changes). Threshold: fail on
#   HIGH+ severity; this is now a blocking gate (promoted Sprint 35 after Sprint 34
#   cleared the 4 Maven CVEs that were the real blocker — the originally-assumed
#   dev-only Angular CVEs were never actually scanned by Snyk, which excludes
#   devDependencies by default). Requires the SNYK_TOKEN_CLAUDE_CODE_CLI repo secret.
#   (Replaced OWASP Dependency-Check, whose full-NVD-database download was too
#   slow/flaky for CI.)
#
# ADMIN ACTION REQUIRED (Dimitri):
#   1. Snyk token — add SNYK_TOKEN_CLAUDE_CODE_CLI as a repository secret
#      (Settings → Secrets and variables → Actions → New repository secret).
#      Get a token from a free Snyk account (Account settings → Auth Token, or a
#      service account). The snyk-security job authenticates with it.
#   2. Dependabot alerts — enabled (confirmed 2026-06-29). .github/dependabot.yml
#      drives the version/security update PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── 1. Shared library (runs its own tests; gates downstream) ──────────────────
  shared-model:
    name: shared-model (install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and install shared-model
        run: cd shared-model && ./mvnw --batch-mode clean install

  # ── 2a. auth-server ──────────────────────────────────────────────────────────
  auth-server:
    name: auth-server (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test auth-server
        run: cd auth-server && ./mvnw --batch-mode clean verify

  # ── 2b. order-service ────────────────────────────────────────────────────────
  order-service:
    name: order-service (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test order-service
        run: cd order-service && ./mvnw --batch-mode clean verify

  # ── 2c. inventory-service ────────────────────────────────────────────────────
  inventory-service:
    name: inventory-service (verify)
    needs: shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared-model to local repo
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Build and test inventory-service
        run: cd inventory-service && ./mvnw --batch-mode clean verify

  # ── 3a. order-ui ─────────────────────────────────────────────────────────────
  order-ui:
    name: order-ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: order-ui/package-lock.json

      - name: Install and build order-ui
        run: cd order-ui && npm ci && npm run build

  # ── 3b. inventory-ui ─────────────────────────────────────────────────────────
  inventory-ui:
    name: inventory-ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-ui/package-lock.json

      - name: Install and build inventory-ui
        run: cd inventory-ui && npm ci && npm run build

  # ── 4. Snyk SCA (server-side dependency vulnerability scan) ──────────────────
  #
  # Policy: fail on HIGH+ severity. This is now a blocking gate — promotional
  # from report-only in Sprint 35 after Sprint 34 pinned the 4 vulnerable
  # transitive Maven dependencies (logback-core, tomcat-embed-core,
  # jackson-databind × 2) that were the real blocker. The originally-assumed
  # dev-only Angular CVEs were never actually scanned by Snyk (it excludes
  # devDependencies by default), so they were never genuinely in the way.
  #
  # One `snyk test --all-projects` covers all 4 Maven poms + both npm UIs. Fast and
  # account-backed — replaced OWASP Dependency-Check, whose ~360k-record NVD database
  # download made it impractical in CI. shared-model is installed inline so the service
  # poms resolve be.dnit:shared-model. Results upload as SARIF to the Security tab.
  #
  # Requires repo secret SNYK_TOKEN_CLAUDE_CODE_CLI (free Snyk account → repo Settings → Secrets → Actions).
  snyk-security:
    name: Snyk SCA (HIGH+ threshold, blocking gate)
    runs-on: ubuntu-latest
    # NOT in any job's `needs` — a scan hiccup cannot mask test failures.
    # Promoted from report-only to blocking gate in Sprint 35 (Sprint 34 cleared the
    # 4 Maven CVEs; the originally-assumed dev-only Angular CVEs were never actually
    # scanned by Snyk, which excludes devDependencies by default).
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install shared-model (so service poms resolve be.dnit:shared-model)
        run: cd shared-model && ./mvnw --batch-mode -q -DskipTests install

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk test — all projects (4 Maven modules + 2 npm UIs), HIGH+
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN_CLAUDE_CODE_CLI }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to the GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

  # ── 5. Containerized E2E smoke test (Playwright) ─────────────────────────
  #
  # Stands up the full backend stack via docker compose, starts both Angular
  # UIs on `npm start`, and runs the Playwright smoke test against them.
  # This is the automated proof that B-6's runtime healthchecks work end-to-end.
  #
  # Isolated: not in any other job's `needs` — a smoke hiccup cannot mask
  # unit-test failures. The compose build is self-contained (each service
  # Dockerfile installs shared-model inline), so no host-side Maven step.
  #
  # Artifacts on failure: Playwright HTML report / traces, docker compose
  # logs, and UI logs.
  e2e-smoke:
    name: e2e-smoke (containerized backend + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start backend stack
        run: docker compose up -d --build

      - name: Wait for backend healthy
        run: |
          set -e
          for svc in auth-server order-service inventory-service; do
            echo "Waiting for $svc to be healthy (timeout 180s)..."
            timeout 180 bash -c '
              svc="$1"
              while true; do
                cid="$(docker compose ps -q "$svc" 2>/dev/null || true)"
                if [ -n "$cid" ] && [ "$(docker inspect -f "{{.State.Health.Status}}" "$cid" 2>/dev/null)" = "healthy" ]; then
                  echo "  $svc is healthy"
                  exit 0
                fi
                sleep 5
              done
            ' _ "$svc" || { echo "ERROR: $svc did not become healthy within 180s"; docker compose logs; exit 1; }
          done
          echo "All services healthy — backend ready."

      - name: Start order-ui and wait
        run: |
          set -e
          cd order-ui && npm ci && npm start > /tmp/order-ui.log 2>&1 &
          echo "Waiting for http://localhost:4200 (timeout 120s)..."
          timeout 120 bash -c "until curl -sf http://localhost:4200 > /dev/null; do sleep 3; done" || {
            echo "ERROR: order-ui did not respond within 120s"
            cat /tmp/order-ui.log
            exit 1
          }
          echo "order-ui is responding."

      - name: Start inventory-ui and wait
        run: |
          set -e
          cd inventory-ui && npm ci && npm start > /tmp/inventory-ui.log 2>&1 &
          echo "Waiting for http://localhost:4201 (timeout 120s)..."
          timeout 120 bash -c "until curl -sf http://localhost:4201 > /dev/null; do sleep 3; done" || {
            echo "ERROR: inventory-ui did not respond within 120s"
            cat /tmp/inventory-ui.log
            exit 1
          }
          echo "inventory-ui is responding."

      - name: Run Playwright smoke test
        run: |
          set -e
          cd e2e && npm ci && npx playwright install --with-deps chromium && npx playwright test

      - name: Capture docker compose logs (on failure)
        if: failure()
        run: docker compose logs > /tmp/docker-compose.logs

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test-results / traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore

      - name: Upload docker compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: /tmp/docker-compose.logs
          if-no-files-found: ignore

      - name: Upload UI logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-logs
          path: |
            /tmp/order-ui.log
            /tmp/inventory-ui.log
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
