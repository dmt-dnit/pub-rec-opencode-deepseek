server:
  port: 9000

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,profile,email

app:
  jwt:
    key-path: ${APP_JWT_KEY_PATH:}
  oauth2:
    success-redirect-base-url: ${APP_OAUTH2_REDIRECT_BASE:http://localhost:4200}

auth:
  jwt:
    issuer: http://localhost:9000
    access-token-expiry: 3600

logging:
  level:
    be.dnit.authserver: INFO
    org.springframework.security: DEBUG
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
